[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "researcher"
version = "0.1.0"
description = "A modular, observable, multi-agent deep-research orchestration system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Aaron" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "openai>=1.40",
    "sentence-transformers>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
pdf = [
    "pymupdf>=1.24",
]

[project.scripts]
researcher = "researcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["researcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "manual: tests that invoke real external tools (claude, codex) — excluded from CI, run locally only",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line too long — soft limit
    "UP045",  # project convention: Optional[X] stays (not `X | None`)
    "UP042",  # project convention: class Foo(str, Enum) stays (not StrEnum)
    "UP035",  # allow `from typing import Callable` etc. — avoids churn
    "E402",   # module-level imports inside functions are intentional (lazy)
    "B008",   # typer's Argument/Option are the recommended default style
]
per-file-ignores = { "tests/**" = ["E402"] }
