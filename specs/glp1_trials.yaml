spec_id: glp1_trials
goal: "FDA-registered GLP-1 receptor agonist clinical trials since 2020"
backend_policy: auto
max_cycles: 5
max_entities_per_cycle: 200
budget_usd: 3.00
wall_limit_s: 600
max_subagent_calls: 200
subagent_timeout_s: 180

entities:
  - name: ClinicalTrial
    fields:
      - { name: name,            type: str,       required: true }
      - { name: nct_id,          type: str }
      - { name: phase,           type: str }
      - { name: drug,            type: str }
      - { name: sponsor,         type: str }
      - { name: status,          type: str }
      - { name: start_date,      type: date }
      - { name: completion_date, type: date }
      - { name: indication,      type: str }
      - { name: enrollment,      type: int }
      - { name: primary_endpoint, type: str }
      - { name: results_url,     type: str }
    search_templates:
      - "{q} GLP-1 clinical trial clinicaltrials.gov"
      - "{q} FDA phase 3"
      - "{q} semaglutide tirzepatide trial"

seeds:
  - "GLP-1 receptor agonist phase 3 trials since 2020"
  - "semaglutide clinical trials"
  - "tirzepatide clinical trials"
  - "liraglutide clinical trials"
  - "GLP-1 obesity trials"
  - "GLP-1 diabetes trials"

distinct_pairs:
  - ["SUSTAIN-6", "SUSTAIN-7"]
  - ["SURPASS-1", "SURPASS-2"]
  - ["STEP-1", "STEP-2"]
  - ["LEADER", "SCALE"]

search:
  provider: tavily
  api_key_env: TAVILY_API_KEY
  max_results: 10

models:
  fast: openrouter/hermes-3-8b
  smart: openrouter/hermes-3-70b
  heavy: anthropic/claude-sonnet-4-6
